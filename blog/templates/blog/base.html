<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <!-- Навигация -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">ItProger</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
            aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.path == '/contact/' %}active{% endif %}" href="/contact/">News</a>
        </li>
      </ul>

      <div class="d-flex">
        {% if user.is_authenticated %}
            <!-- Кнопка добавления статьи только для зарегистрированных -->
            <a href="{% url 'news_add' %}" class="btn btn-success me-2">Добавить статью</a>

            <!-- Профиль и выход -->
            <a href="{% url 'profile' %}" class="btn btn-warning me-2">Профиль</a>
            <form action="{% url 'exit' %}" method="post" class="d-inline">
                {% csrf_token %}
                <button type="submit" class="btn btn-info">Выйти</button>
            </form>
        {% else %}
            <!-- Регистрация и вход для гостей -->
            <a href="{% url 'reg' %}" class="btn btn-outline-warning me-2">Регистрация</a>
            <a href="{% url 'user' %}" class="btn btn-outline-info">Войти</a>
        {% endif %}
      </div>
    </div>
  </div>
</nav>

    <!-- Основной контент -->
    <div class="container mt-5">
        {% if messages %}
        {% for mess in messages %}
        <div class="alert  alert-success">{{ mess }}</div>
        {% endfor %}
        {% endif %}

        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-OERcA2JDkQqQ4d6EoYj5LDj6lz+5E6k6Ec6bC7cVhXZl7zz/6Mtvj13cF4aG7X4E" crossorigin="anonymous"></script>
</body>
</html>
