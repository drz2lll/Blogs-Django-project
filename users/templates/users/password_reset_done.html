{% extends 'blog/base.html' %}

{% block title %}Письмо успешно отправлено{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow p-4 rounded text-center">
            <h2 class="card-title mb-4">✅ Письмо отправлено</h2>
            <p class="text-muted mb-4">
                Если введённая почта зарегистрирована в системе,<br>
                мы отправили на неё ссылку для восстановления пароля.
            </p>
            
            <a href="{% url 'login' %}" class="btn btn-primary w-100 mt-2">
                Вернуться к входу
            </a>
            
            <div class="text-center mt-4">
                <a href="{% url 'reg' %}" class="text-decoration-none">Нет аккаунта? Зарегистрироваться</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
